<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'JetBrains Mono',monospace"><rect width="800" height="450" fill="#F4F4F2"/>
<text x="400" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#0C0C0C">REAL RESULTS, TWO DIFFERENT ACCOUNTS</text>

<!-- LEFT CARD: Google Ads -->
<rect x="60" y="65" width="320" height="330" rx="12" fill="#FFFFFF" stroke="#0C0C0C" stroke-width="1.5"/>
<rect x="60" y="65" width="320" height="44" rx="12" fill="#2D6BFF"/>
<rect x="60" y="97" width="320" height="12" fill="#2D6BFF"/>
<text x="220" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">GOOGLE ADS · ECOMMERCE</text>

<text x="220" y="160" text-anchor="middle" font-size="30" font-weight="700" fill="#0C0C0C">$22.9M</text>
<text x="220" y="182" text-anchor="middle" font-size="11.5" fill="#7A7A78">REVENUE GENERATED</text>

<line x1="100" y1="205" x2="340" y2="205" stroke="#0C0C0C" stroke-width="1" opacity="0.15"/>

<text x="220" y="245" text-anchor="middle" font-size="30" font-weight="700" fill="#00C853">632%</text>
<text x="220" y="267" text-anchor="middle" font-size="11.5" fill="#7A7A78">ROAS AFTER REBUILDING AI SIGNALS</text>

<line x1="100" y1="290" x2="340" y2="290" stroke="#0C0C0C" stroke-width="1" opacity="0.15"/>

<text x="220" y="330" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0C0C0C">195 leads in 60 days</text>
<text x="220" y="352" text-anchor="middle" font-size="11.5" fill="#7A7A78">35% lower cost per acquisition</text>
<text x="220" y="378" text-anchor="middle" font-size="10.5" fill="#7A7A78">Demand already existed. It was captured.</text>

<!-- RIGHT CARD: Meta Ads -->
<rect x="420" y="65" width="320" height="330" rx="12" fill="#FFFFFF" stroke="#0C0C0C" stroke-width="1.5"/>
<rect x="420" y="65" width="320" height="44" rx="12" fill="#FF4438"/>
<rect x="420" y="97" width="320" height="12" fill="#FF4438"/>
<text x="580" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">META ADS · LEAD GEN</text>

<text x="580" y="152" text-anchor="middle" font-size="19" font-weight="700" fill="#7A7A78" text-decoration="line-through">$170.53</text>
<text x="580" y="182" text-anchor="middle" font-size="30" font-weight="700" fill="#0C0C0C">$90.77</text>
<text x="580" y="204" text-anchor="middle" font-size="11.5" fill="#7A7A78">COST PER LEAD, DOWN 50%</text>

<line x1="460" y1="222" x2="700" y2="222" stroke="#0C0C0C" stroke-width="1" opacity="0.15"/>

<text x="580" y="255" text-anchor="middle" font-size="15" font-weight="700" fill="#7A7A78">3.05 →</text>
<text x="580" y="280" text-anchor="middle" font-size="30" font-weight="700" fill="#00C853">5.77</text>
<text x="580" y="302" text-anchor="middle" font-size="11.5" fill="#7A7A78">ROAS, REBUILT CREATIVE + TRACKING</text>

<line x1="460" y1="320" x2="700" y2="320" stroke="#0C0C0C" stroke-width="1" opacity="0.15"/>

<text x="580" y="345" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0C0C0C">36 → 137 leads</text>
<text x="580" y="367" text-anchor="middle" font-size="10.5" fill="#7A7A78">Demand didn't exist yet. It was created.</text>

<text x="400" y="430" text-anchor="middle" font-size="11" fill="#0C0C0C" font-weight="700">Same agency, two accounts, two different jobs done well.</text>
</svg>
