<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'JetBrains Mono',monospace"><rect width="800" height="450" fill="#F4F4F2"/>
<text x="400" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#0C0C0C">TWO DIFFERENT JOBS, NOT ONE PLATFORM BEATING THE OTHER</text>

<!-- Divider -->
<line x1="400" y1="60" x2="400" y2="400" stroke="#0C0C0C" stroke-width="1" stroke-dasharray="3 5" opacity="0.4"/>

<!-- LEFT: Google Ads intercepts existing demand -->
<text x="200" y="80" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2D6BFF">GOOGLE ADS: INTERCEPT</text>
<rect x="65" y="100" width="270" height="48" rx="8" fill="#FFFFFF" stroke="#0C0C0C" stroke-width="1.5"/>
<text x="200" y="129" text-anchor="middle" font-size="11" font-weight="700" fill="#0C0C0C">"emergency plumber near me"</text>
<line x1="200" y1="148" x2="200" y2="178" stroke="#0C0C0C" stroke-width="2"/>
<polygon points="200,186 193,173 207,173" fill="#0C0C0C"/>
<rect x="65" y="190" width="270" height="42" rx="8" fill="#2D6BFF" stroke="#0C0C0C" stroke-width="1.5"/>
<text x="200" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Ad shown, already searching</text>
<line x1="200" y1="232" x2="200" y2="262" stroke="#0C0C0C" stroke-width="2"/>
<polygon points="200,270 193,257 207,257" fill="#0C0C0C"/>
<rect x="95" y="274" width="210" height="42" rx="8" fill="#00C853" stroke="#0C0C0C" stroke-width="1.5"/>
<text x="200" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#0C0C0C">Click, ready to act</text>
<text x="200" y="348" text-anchor="middle" font-size="11" fill="#7A7A78">Demand already exists.</text>
<text x="200" y="365" text-anchor="middle" font-size="11" fill="#7A7A78">Google Ads captures it.</text>

<!-- RIGHT: Meta Ads creates demand -->
<text x="600" y="80" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FF4438">META ADS: CREATE</text>
<rect x="465" y="100" width="270" height="48" rx="8" fill="#FFFFFF" stroke="#0C0C0C" stroke-width="1.5"/>
<text x="600" y="129" text-anchor="middle" font-size="11" font-weight="700" fill="#0C0C0C">Scrolling, not looking for anything</text>
<line x1="600" y1="148" x2="600" y2="178" stroke="#0C0C0C" stroke-width="2"/>
<polygon points="600,186 593,173 607,173" fill="#0C0C0C"/>
<rect x="465" y="190" width="270" height="42" rx="8" fill="#FF4438" stroke="#0C0C0C" stroke-width="1.5"/>
<text x="600" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Creative interrupts the scroll</text>
<line x1="600" y1="232" x2="600" y2="262" stroke="#0C0C0C" stroke-width="2"/>
<polygon points="600,270 593,257 607,257" fill="#0C0C0C"/>
<rect x="475" y="274" width="250" height="42" rx="8" fill="#FFC400" stroke="#0C0C0C" stroke-width="1.5"/>
<text x="600" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#0C0C0C">New want, created just now</text>
<text x="600" y="348" text-anchor="middle" font-size="11" fill="#7A7A78">Demand doesn't exist yet.</text>
<text x="600" y="365" text-anchor="middle" font-size="11" fill="#7A7A78">Meta Ads creates it.</text>

<text x="400" y="415" text-anchor="middle" font-size="11" fill="#0C0C0C" font-weight="700">First dollar goes wherever the demand already lives.</text>
</svg>
