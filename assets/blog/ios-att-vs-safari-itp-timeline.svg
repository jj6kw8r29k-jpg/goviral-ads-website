<text x="100" y="150" font-size="13" font-weight="700" fill="#0C0C0C">SAFARI ITP (WEBKIT)</text>
<rect x="100" y="165" width="640" height="30" rx="6" fill="#2D6BFF" stroke="#0C0C0C" stroke-width="1.5"/>
<text x="420" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">BLOCKS 3RD-PARTY COOKIES FOR EVERY SAFARI USER, NO PROMPT NEEDED</text>
<line x1="100" y1="195" x2="100" y2="380" stroke="#2D6BFF" stroke-width="1.5" stroke-dasharray="3 4"/>
