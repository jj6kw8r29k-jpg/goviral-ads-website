<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'JetBrains Mono',monospace">
<rect width="800" height="450" fill="#F4F4F2"/>
<text x="400" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0C0C0C">THE 12-POINT AEO CHECKLIST</text>

<rect x="40" y="50" width="350" height="175" fill="#FFFFFF" stroke="#0C0C0C" stroke-width="1.5"/>
<rect x="40" y="50" width="350" height="28" fill="#2D6BFF" stroke="#0C0C0C" stroke-width="1.5"/>
<text x="215" y="69" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">1. LET THE CRAWLERS IN</text>
<g font-size="11.5" fill="#0C0C0C">
<circle cx="60" cy="103" r="7" fill="#00C853" stroke="#0C0C0C" stroke-width="1.5"/><path d="M56,103 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="107">Robots.txt allows AI crawlers</text>
<circle cx="60" cy="138" r="7" fill="#00C853" stroke="#0C0C0C" stroke-width="1.5"/><path d="M56,138 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="142">llms.txt exists at your root</text>
<circle cx="60" cy="173" r="7" fill="#00C853" stroke="#0C0C0C" stroke-width="1.5"/><path d="M56,173 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="177">Sitemap current, canonicals clean</text>
</g>

<rect x="410" y="50" width="350" height="175" fill="#FFFFFF" stroke="#0C0C0C" stroke-width="1.5"/>
<rect x="410" y="50" width="350" height="28" fill="#FFC400" stroke="#0C0C0C" stroke-width="1.5"/>
<text x="585" y="69" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0C0C0C">2. MAKE YOUR ENTITY CLEAR</text>
<g font-size="11.5" fill="#0C0C0C">
<circle cx="430" cy="103" r="7" fill="#00C853" stroke="#0C0C0C" stroke-width="1.5"/><path d="M426,103 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<text x="448" y="107">Organization schema sitewide</text>
<circle cx="430" cy="138" r="7" fill="#00C853" stroke="#0C0C0C" stroke-width="1.5"/><path d="M426,138 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<text x="448" y="142">One consistent bio, everywhere</text>
<circle cx="430" cy="173" r="7" fill="#00C853" stroke="#0C0C0C" stroke-width="1.5"/><path d="M426,173 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<text x="448" y="177">Real authors, not "Admin"</text>
</g>

<rect x="40" y="245" width="350" height="175" fill="#FFFFFF" stroke="#0C0C0C" stroke-width="1.5"/>
<rect x="40" y="245" width="350" height="28" fill="#00C853" stroke="#0C0C0C" stroke-width="1.5"/>
<text x="215" y="264" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">3. STRUCTURE TO BE LIFTED</text>
<g font-size="11.5" fill="#0C0C0C">
<circle cx="60" cy="298" r="7" fill="#00C853" stroke="#0C0C0C" stroke-width="1.5"/><path d="M56,298 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="302">FAQ schema matches visible FAQs</text>
<circle cx="60" cy="333" r="7" fill="#00C853" stroke="#0C0C0C" stroke-width="1.5"/><path d="M56,333 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="337">Direct answer under every H2</text>
<circle cx="60" cy="368" r="7" fill="#00C853" stroke="#0C0C0C" stroke-width="1.5"/><path d="M56,368 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<text x="78" y="372">Headings phrased as questions</text>
</g>

<rect x="410" y="245" width="350" height="175" fill="#FFFFFF" stroke="#0C0C0C" stroke-width="1.5"/>
<rect x="410" y="245" width="350" height="28" fill="#FF4438" stroke="#0C0C0C" stroke-width="1.5"/>
<text x="585" y="264" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">4. PROVE YOU'RE WORTH CITING</text>
<g font-size="11.5" fill="#0C0C0C">
<circle cx="430" cy="298" r="7" fill="#00C853" stroke="#0C0C0C" stroke-width="1.5"/><path d="M426,298 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<text x="448" y="302">Specific numbers, not vague claims</text>
<circle cx="430" cy="333" r="7" fill="#00C853" stroke="#0C0C0C" stroke-width="1.5"/><path d="M426,333 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<text x="448" y="337">Published &amp; modified dates current</text>
<circle cx="430" cy="368" r="7" fill="#00C853" stroke="#0C0C0C" stroke-width="1.5"/><path d="M426,368 l3,3 l6,-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<text x="448" y="372">Third-party mentions building trust</text>
</g>
</svg>
