<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'JetBrains Mono',monospace"><rect width="800" height="450" fill="#F4F4F2"/>
<text x="400" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0C0C0C">ANNUALIZED: IN-HOUSE SALARY VS. AGENCY TIERS</text>

<line x1="230" y1="70" x2="230" y2="400" stroke="#0C0C0C" stroke-width="1.5"/>

<rect x="538" y="70" width="34" height="320" fill="#FF4438" fill-opacity="0.18"/>
<line x1="538" y1="70" x2="538" y2="390" stroke="#FF4438" stroke-width="1.5" stroke-dasharray="3 4"/>
<line x1="572" y1="70" x2="572" y2="390" stroke="#FF4438" stroke-width="1.5" stroke-dasharray="3 4"/>
<line x1="555" y1="66" x2="555" y2="70" stroke="#FF4438" stroke-width="1.5"/>
<text x="650" y="47" text-anchor="middle" font-size="12" font-weight="700" fill="#FF4438">IN-HOUSE LOADED COST</text>
<text x="650" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#FF4438">$144K &#8211; $161K/YR</text>

<rect x="262" y="90" width="24" height="80" fill="#00C853" stroke="#0C0C0C" stroke-width="1.5"/>
<text x="245" y="100" text-anchor="end" font-size="12.5" font-weight="700" fill="#0C0C0C">BUDGET /</text>
<text x="245" y="115" text-anchor="end" font-size="12.5" font-weight="700" fill="#0C0C0C">FREELANCER</text>
<text x="245" y="150" text-anchor="end" font-size="10.5" fill="#7A7A78">UNDER $3K/MO</text>
<text x="245" y="163" text-anchor="end" font-size="10.5" fill="#7A7A78">AD SPEND</text>
<text x="274" y="83" text-anchor="middle" font-size="11" font-weight="700" fill="#0C0C0C">$6K &#8211; $18K/yr</text>

<rect x="286" y="190" width="84" height="80" fill="#2D6BFF" stroke="#0C0C0C" stroke-width="1.5"/>
<text x="245" y="200" text-anchor="end" font-size="12.5" font-weight="700" fill="#0C0C0C">MID-TIER</text>
<text x="245" y="215" text-anchor="end" font-size="12.5" font-weight="700" fill="#0C0C0C">AGENCY</text>
<text x="245" y="250" text-anchor="end" font-size="10.5" fill="#7A7A78">$10K&#8211;$50K/MO</text>
<text x="245" y="263" text-anchor="end" font-size="10.5" fill="#7A7A78">AD SPEND</text>
<text x="328" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">$18K &#8211;</text>
<text x="328" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">$60K/yr</text>

<rect x="370" y="290" width="360" height="80" fill="#FFC400" stroke="#0C0C0C" stroke-width="1.5"/>
<text x="245" y="300" text-anchor="end" font-size="12.5" font-weight="700" fill="#0C0C0C">PREMIUM /</text>
<text x="245" y="315" text-anchor="end" font-size="12.5" font-weight="700" fill="#0C0C0C">ENTERPRISE</text>
<text x="245" y="350" text-anchor="end" font-size="10.5" fill="#7A7A78">$100K+/MO</text>
<text x="245" y="363" text-anchor="end" font-size="10.5" fill="#7A7A78">AD SPEND</text>
<text x="550" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#0C0C0C">$60K &#8211; $240K+/yr</text>

<line x1="250" y1="400" x2="750" y2="400" stroke="#0C0C0C" stroke-width="1.5"/>
<text x="250" y="415" text-anchor="middle" font-size="10" fill="#7A7A78">$0</text>
<text x="350" y="415" text-anchor="middle" font-size="10" fill="#7A7A78">$50K</text>
<text x="450" y="415" text-anchor="middle" font-size="10" fill="#7A7A78">$100K</text>
<text x="550" y="415" text-anchor="middle" font-size="10" fill="#7A7A78">$150K</text>
<text x="650" y="415" text-anchor="middle" font-size="10" fill="#7A7A78">$200K</text>
<text x="750" y="415" text-anchor="middle" font-size="10" fill="#7A7A78">$250K</text>

<text x="400" y="437" text-anchor="middle" font-size="11" fill="#7A7A78">Only the premium agency tier overlaps what one in-house salary actually costs.</text>
