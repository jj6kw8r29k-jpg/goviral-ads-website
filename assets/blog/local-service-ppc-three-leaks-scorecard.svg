<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'JetBrains Mono',monospace"><rect width="800" height="450" fill="#F4F4F2"/>
<text x="400" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#0C0C0C">THE THREE LOCAL SERVICE PPC LEAKS</text>
<rect x="60" y="70" width="330" height="340" rx="14" fill="#FFFFFF" stroke="#0C0C0C" stroke-width="1.5"/>
<rect x="60" y="70" width="330" height="42" rx="14" fill="#FF4438"/>
<rect x="60" y="98" width="330" height="14" fill="#FF4438"/>
<text x="225" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">LEAKING</text>
<g font-size="12.5" fill="#0C0C0C">
<circle cx="90" cy="150" r="9" fill="none" stroke="#FF4438" stroke-width="2"/><line x1="85" y1="145" x2="95" y2="155" stroke="#FF4438" stroke-width="2"/><line x1="95" y1="145" x2="85" y2="155" stroke="#FF4438" stroke-width="2"/>
<text x="112" y="149">Radius set to the whole metro area</text>
<circle cx="90" cy="200" r="9" fill="none" stroke="#FF4438" stroke-width="2"/><line x1="85" y1="195" x2="95" y2="205" stroke="#FF4438" stroke-width="2"/><line x1="95" y1="195" x2="85" y2="205" stroke="#FF4438" stroke-width="2"/>
<text x="112" y="199">Callback happens in hours,</text>
<text x="112" y="219">not minutes</text>
<circle cx="90" cy="260" r="9" fill="none" stroke="#FF4438" stroke-width="2"/><line x1="85" y1="255" x2="95" y2="265" stroke="#FF4438" stroke-width="2"/><line x1="95" y1="255" x2="85" y2="265" stroke="#FF4438" stroke-width="2"/>
<text x="112" y="259">Every form fill counted as</text>
<text x="112" y="279">a real lead, no call tracking</text>
</g>
<rect x="410" y="70" width="330" height="340" rx="14" fill="#FFFFFF" stroke="#0C0C0C" stroke-width="1.5"/>
<rect x="410" y="70" width="330" height="42" rx="14" fill="#00C853"/>
<rect x="410" y="98" width="330" height="14" fill="#00C853"/>
<text x="575" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">FIXED</text>
<g font-size="12.5" fill="#0C0C0C">
<circle cx="440" cy="150" r="9" fill="#00C853"/><path d="M436,150 l3,3 l6,-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<text x="462" y="154">Radius matched to the real</text>
<text x="462" y="174">coverage area</text>
<circle cx="440" cy="205" r="9" fill="#00C853"/><path d="M436,205 l3,3 l6,-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<text x="462" y="209">Callback inside 5 minutes</text>
<circle cx="440" cy="255" r="9" fill="#00C853"/><path d="M436,255 l3,3 l6,-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<text x="462" y="259">Call tracking separates real</text>
<text x="462" y="279">jobs from junk clicks</text>
</g>
</svg>
