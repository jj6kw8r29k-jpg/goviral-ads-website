<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'JetBrains Mono',monospace"><rect width="800" height="450" fill="#F4F4F2"/>
<text x="400" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#0C0C0C">DOES YOUR LANDING PAGE KILL CONVERSIONS OR EARN THEM?</text>
<text x="400" y="54" text-anchor="middle" font-size="11" fill="#7A7A78">THE SAME 4 CHECKS, TWO DIFFERENT RESULTS</text>

<rect x="60" y="76" width="330" height="334" rx="14" fill="#FFFFFF" stroke="#0C0C0C" stroke-width="1.5"/>
<rect x="60" y="76" width="330" height="42" rx="14" fill="#FF4438"/>
<rect x="60" y="104" width="330" height="14" fill="#FF4438"/>
<text x="225" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">KILLS CONVERSIONS</text>
<g font-size="12" fill="#0C0C0C">
<circle cx="90" cy="150" r="9" fill="none" stroke="#FF4438" stroke-width="2"/><line x1="85" y1="145" x2="95" y2="155" stroke="#FF4438" stroke-width="2"/><line x1="95" y1="145" x2="85" y2="155" stroke="#FF4438" stroke-width="2"/>
<text x="112" y="154">Headline doesn't match the ad</text>
<circle cx="90" cy="196" r="9" fill="none" stroke="#FF4438" stroke-width="2"/><line x1="85" y1="191" x2="95" y2="201" stroke="#FF4438" stroke-width="2"/><line x1="95" y1="191" x2="85" y2="201" stroke="#FF4438" stroke-width="2"/>
<text x="112" y="200">Sells the whole company, not</text>
<text x="112" y="216">one offer</text>
<circle cx="90" cy="262" r="9" fill="none" stroke="#FF4438" stroke-width="2"/><line x1="85" y1="257" x2="95" y2="267" stroke="#FF4438" stroke-width="2"/><line x1="95" y1="257" x2="85" y2="267" stroke="#FF4438" stroke-width="2"/>
<text x="112" y="266">Form asks 8+ fields upfront</text>
<circle cx="90" cy="308" r="9" fill="none" stroke="#FF4438" stroke-width="2"/><line x1="85" y1="303" x2="95" y2="313" stroke="#FF4438" stroke-width="2"/><line x1="95" y1="303" x2="85" y2="313" stroke="#FF4438" stroke-width="2"/>
<text x="112" y="312">Only ever reviewed on desktop</text>
</g>

<rect x="410" y="76" width="330" height="334" rx="14" fill="#FFFFFF" stroke="#0C0C0C" stroke-width="1.5"/>
<rect x="410" y="76" width="330" height="42" rx="14" fill="#00C853"/>
<rect x="410" y="104" width="330" height="14" fill="#00C853"/>
<text x="575" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">BUILT TO CONVERT</text>
<g font-size="12" fill="#0C0C0C">
<circle cx="440" cy="150" r="9" fill="#00C853"/><path d="M436,150 l3,3 l6,-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<text x="462" y="154">Headline repeats the ad's exact</text>
<text x="462" y="170">offer</text>
<circle cx="440" cy="216" r="9" fill="#00C853"/><path d="M436,216 l3,3 l6,-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<text x="462" y="220">Built around one offer, one goal</text>
<circle cx="440" cy="262" r="9" fill="#00C853"/><path d="M436,262 l3,3 l6,-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<text x="462" y="266">Form asks only what the next</text>
<text x="462" y="282">step requires</text>
<circle cx="440" cy="328" r="9" fill="#00C853"/><path d="M436,328 l3,3 l6,-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<text x="462" y="332">Stress-tested on an actual phone</text>
</g>

<text x="400" y="436" text-anchor="middle" font-size="10.5" fill="#7A7A78">Four checks. Same traffic. A very different conversion rate.</text>
</svg>
