<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'JetBrains Mono',monospace"><rect width="800" height="450" fill="#F4F4F2"/>
<text x="400" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#0C0C0C">WHY LOCAL SERVICE PPC BREAKS DIFFERENTLY</text>
<rect x="60" y="70" width="330" height="340" rx="14" fill="#FFFFFF" stroke="#0C0C0C" stroke-width="1.5"/>
<rect x="60" y="70" width="330" height="42" rx="14" fill="#7A7A78"/>
<rect x="60" y="98" width="330" height="14" fill="#7A7A78"/>
<text x="225" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">E-COMMERCE PPC</text>
<g font-size="12.5" fill="#0C0C0C">
<circle cx="90" cy="150" r="9" fill="#7A7A78"/><path d="M86,150 l3,3 l6,-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<text x="112" y="154">Open 24 hours, no staff needed</text>
<circle cx="90" cy="195" r="9" fill="#7A7A78"/><path d="M86,195 l3,3 l6,-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<text x="112" y="199">Sells to any zip code, any state</text>
<circle cx="90" cy="240" r="9" fill="#7A7A78"/><path d="M86,240 l3,3 l6,-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<text x="112" y="244">Checkout completes the sale</text>
<text x="112" y="269">automatically, no callback needed</text>
</g>
<rect x="90" y="330" width="270" height="52" rx="8" fill="#F4F4F2" stroke="#7A7A78" stroke-width="1.5"/>
<text x="225" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#0C0C0C">ONE REAL CONSTRAINT:</text>
<text x="225" y="370" text-anchor="middle" font-size="11" fill="#0C0C0C">Does the ad lead to a sale?</text>
<rect x="410" y="70" width="330" height="340" rx="14" fill="#FFFFFF" stroke="#0C0C0C" stroke-width="1.5"/>
<rect x="410" y="70" width="330" height="42" rx="14" fill="#2D6BFF"/>
<rect x="410" y="98" width="330" height="14" fill="#2D6BFF"/>
<text x="575" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">LOCAL SERVICE PPC</text>
<g font-size="12.5" fill="#0C0C0C">
<circle cx="440" cy="150" r="9" fill="#2D6BFF"/><path d="M436,150 l3,3 l6,-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<text x="462" y="154">Bounded by the service radius</text>
<circle cx="440" cy="195" r="9" fill="#2D6BFF"/><path d="M436,195 l3,3 l6,-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<text x="462" y="199">Bounded by hours and staff on call</text>
<circle cx="440" cy="240" r="9" fill="#2D6BFF"/><path d="M436,240 l3,3 l6,-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<text x="462" y="244">Conversion depends on a callback,</text>
<text x="462" y="269">not a checkout page</text>
</g>
<rect x="440" y="330" width="270" height="52" rx="8" fill="#2D6BFF" fill-opacity="0.08" stroke="#2D6BFF" stroke-width="1.5"/>
<text x="575" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#0C0C0C">THREE REAL CONSTRAINTS:</text>
<text x="575" y="370" text-anchor="middle" font-size="11" fill="#0C0C0C">Area, availability, speed to lead</text>
</svg>
